name: CompanyOS Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest

      - name: Verify
        run: pytest -q

      - name: Build artifact
        run: |
          mkdir -p dist
          tar -czf dist/companyos-release-${{ github.sha }}.tar.gz companyos scripts tests

      - name: Staging gate
        if: inputs.environment == 'staging'
        run: echo "Staging deployment hook goes here"

      - name: Production gate
        if: inputs.environment == 'production'
        run: |
          echo "Production deployment requires GitHub Environment approval"
          echo "Actual deploy command belongs here after provider configuration"

      - name: Post-deploy verification placeholder
        run: echo "Run smoke + health verification here"
