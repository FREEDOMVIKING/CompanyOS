<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>CompanyOS Venture Identity + Progression</title>
<style>body{font-family:system-ui;background:#0b0d10;color:#eee;padding:18px}.c{background:#151922;border:1px solid #303744;border-radius:16px;padding:16px;margin:12px 0}.warn{color:#ffbf69}.good{color:#7ee787}a{color:#8fc5ff}</style>
<h1>Venture Identity + Progression</h1><p><a href="http://127.0.0.1:8768">Activity Ledger</a> · <a href="http://127.0.0.1:8769">Lifecycle</a></p><div id=x>Loading…</div>
<script>
async function load(){let d=await (await fetch('/api/progression')).json();x.innerHTML='';for(let v of d.ventures){let e=document.createElement('div');e.className='c';e.innerHTML=`<h2>${v.display_name}</h2><p><b>Canonical ID:</b> ${v.canonical_id}</p><p><b>Aliases merged:</b> ${v.aliases.join(', ')}</p><p><b>Stage:</b> ${v.stage}</p><p><b>Artifacts:</b> ${v.artifact_count}</p><p><b>Changed:</b> <span class="${v.changed_since_previous_observation?'good':''}">${v.changed_since_previous_observation?'YES':'NO'}</span></p><p><b>Unchanged observations:</b> ${v.unchanged_observations}</p><p class="${v.duplicate_work_risk?'warn':''}"><b>Duplicate-work guard:</b> ${v.duplicate_work_risk?'ACTIVE':'CLEAR'}</p><p><b>Required next action:</b> ${v.required_next_action}</p>`;x.appendChild(e)}if(!d.ventures.length)x.innerHTML='<div class=c>No canonical ventures detected.</div>'}load();setInterval(load,15000)
</script>
